services:
  pulse_api:
    image: ghcr.io/julienlambs/pulse-api:latest
    container_name: pulse_api
    restart: unless-stopped
    volumes:
      - ./data:/data
    env_file: .env
    networks:
      - pulse_net

  pulse_frontend:
    image: ghcr.io/julienlambs/pulse-frontend:latest
    container_name: pulse_frontend
    restart: unless-stopped
    ports:
      - "8085:80"
    depends_on:
      - pulse_api
    networks:
      - pulse_net

networks:
  pulse_net:
    driver: bridge
